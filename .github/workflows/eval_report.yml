name: 실험 결과 자동 보고서

on:
  push:
    branches:
      - 'exp/**'
    paths:
      - 'experiments/results/**.json'

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 보고서 생성
        run: |
          python experiments/compare_results.py --out reports/latest.md
          cat reports/latest.md

      - name: 보고서 커밋 (reports 브랜치)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/latest.md
          git diff --cached --quiet || git commit -m "chore: update experiment report [skip ci]"
          git push origin HEAD

      - name: PR에 보고서 댓글
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('reports/latest.md', 'utf8');

            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${context.ref.replace('refs/heads/', '')}`,
              state: 'open',
            });

            if (prs.data.length === 0) return;

            const prNumber = prs.data[0].number;
            const body = `## 실험 결과 자동 보고서\n\n${report}`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body.slice(0, 65000),
            });
